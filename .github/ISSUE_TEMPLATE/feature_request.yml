name: Feature / 功能建议
description: 说明实际使用场景与希望改进的行为。
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和问题 / Use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方法 / Alternatives
